# Demo configuration. Free instances have no persistent disk; see docs/DEPLOYMENT.md.
services:
  - type: web
    name: kadrovo-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/start-render.mjs
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kadrovo-db
          property: connectionString
      - key: CONTENT_DIR
        value: /app/data/content
      - key: CONTENT_AUTO_SYNC
        value: 'false'
      - key: LOCAL_CONTENT_PREVIEW
        value: 'false'
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: GOMAXPROCS
        value: '2'
      - key: UV_THREADPOOL_SIZE
        value: '2'
      - key: VIPS_CONCURRENCY
        value: '2'
      - key: NODE_OPTIONS
        value: --v8-pool-size=1
      - key: KINOPOISK_UNOFFICIAL_API_KEY
        sync: false

databases:
  - name: kadrovo-db
    plan: free
    region: frankfurt
    databaseName: kadrovo
    user: kadrovo
    ipAllowList: []
